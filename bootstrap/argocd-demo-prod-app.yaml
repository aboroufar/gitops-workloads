apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-demo-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/aboroufar/gitops-workloads.git
    targetRevision: main
    path: apps/argocd-demo/environments/prod
  destination:
    name: aws-eks-prod       # Targets the registered remote cluster
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true